<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CMS — OSC'ART Production</title>
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
<script>
/* ============================================================
   CMS EN LIGNE (Decap CMS)
   Les modifications sont commitées dans votre dépôt GitHub,
   ce qui redéploie automatiquement le site sur Vercel.

   ⚠️ À CONFIGURER UNE FOIS :
   1. Remplacez VOTRE_COMPTE/VOTRE_REPO ci-dessous par votre dépôt GitHub
   2. Créez une GitHub OAuth App (voir README section "CMS en ligne")
      → Callback URL : https://VOTRE-DOMAINE/api/callback
   3. Ajoutez GITHUB_CLIENT_ID et GITHUB_CLIENT_SECRET dans les
      variables d'environnement Vercel
   ============================================================ */
CMS.init({
  config: {
    backend: {
      name: 'github',
        repo: 'mohamedyassinedridi-sketch/oscart-production',
      branch: 'main',
      base_url: window.location.origin,
      auth_endpoint: 'api/auth'
    },
    locale: 'fr',
    site_url: window.location.origin,
    media_folder: 'images/uploads',
    public_folder: '/images/uploads',
    collections: [
      {
        name: 'settings',
        label: '⚙️ Réglages du site',
        files: [
          {
            name: 'site',
            label: 'Général',
            file: 'data/site.json',
            editor: { preview: false },
            fields: [
              { name: 'contact', label: 'Coordonnées', widget: 'object', collapsed: true, fields: [
                { name: 'phone',   label: 'Téléphone', widget: 'string', required: false },
                { name: 'email',   label: 'Email',     widget: 'string', required: false },
                { name: 'address', label: 'Adresse',   widget: 'string', required: false }
              ]},
              { name: 'social', label: 'Réseaux sociaux', widget: 'object', collapsed: true, fields: [
                { name: 'instagram', label: 'Instagram', widget: 'string', required: false },
                { name: 'youtube',   label: 'YouTube',    widget: 'string', required: false },
                { name: 'vimeo',     label: 'Vimeo',      widget: 'string', required: false },
                { name: 'linkedin',  label: 'LinkedIn',   widget: 'string', required: false },
                { name: 'tiktok',    label: 'TikTok',     widget: 'string', required: false }
              ]},
              { name: 'stats', label: "Statistiques de l'accueil", widget: 'list', fields: [
                { name: 'v', label: 'Chiffre',  widget: 'string' },
                { name: 'l', label: 'Libellé',  widget: 'string' }
              ]},
              { name: 'showreel', label: 'URL Showreel (YouTube/Vimeo)', widget: 'string', required: false },
              { name: 'media', label: 'Images', widget: 'object', collapsed: true, fields: [
                { name: 'logo', label: 'Logo',                 widget: 'image', required: false },
                { name: 'hero', label: "Fond de l'accueil",    widget: 'image', required: false }
              ]}
            ]
          }
        ]
      },
      {
        name: 'portfolio',
        label: '🎬 Portfolio',
        editor: { preview: false },
        files: [
          {
            name: 'portfolio',
            label: 'Projets vidéo',
            file: 'data/portfolio.json',
            editor: { preview: false },
            fields: [
              { name: 'portfolio', label: 'Projets', widget: 'list', fields: [
                { name: 'title',    label: 'Titre *',       widget: 'string' },
                { name: 'category', label: 'Catégorie',     widget: 'select', options: [
                  { label: 'Film',         value: 'film'  },
                  { label: 'Clip',         value: 'clip'  },
                  { label: 'Documentaire', value: 'doc'   },
                  { label: 'Publicité',    value: 'pub'   },
                  { label: 'Événement',    value: 'event' }
                ]},
                { name: 'subtitle', label: 'Sous-titre',    widget: 'string', required: false },
                { name: 'tags',     label: 'Tags',          widget: 'string', required: false },
                { name: 'thumb',    label: 'Vignette',      widget: 'image',  required: false },
                { name: 'video',    label: 'URL vidéo YouTube/Vimeo', widget: 'string', required: false },
                { name: 'client',   label: 'Client',        widget: 'string', required: false },
                { name: 'year',     label: 'Année',         widget: 'string', required: false },
                { name: 'desc',     label: 'Description',   widget: 'text',   required: false }
              ]}
            ]
          }
        ]
      },
      {
        name: 'team',
        label: '👥 Équipe',
        editor: { preview: false },
        files: [
          {
            name: 'team',
            label: 'Membres',
            file: 'data/team.json',
            editor: { preview: false },
            fields: [
              { name: 'team', label: 'Membres', widget: 'list', fields: [
                { name: 'name',  label: 'Nom *',  widget: 'string' },
                { name: 'role',  label: 'Rôle',   widget: 'string', required: false },
                { name: 'bio',   label: 'Bio',    widget: 'text',   required: false },
                { name: 'photo', label: 'Photo',  widget: 'image',  required: false }
              ]}
            ]
          }
        ]
      },
      {
        name: 'services',
        label: '🛠 Services',
        editor: { preview: false },
        files: [
          {
            name: 'services',
            label: 'Offres',
            file: 'data/services.json',
            editor: { preview: false },
            fields: [
              { name: 'services', label: 'Services', widget: 'list', fields: [
                { name: 'id',     label: 'Identifiant ancre (ex. films)', widget: 'string' },
                { name: 'icon',   label: 'Icône emoji',                   widget: 'string' },
                { name: 'tag',    label: 'Étiquette (ex. 01 · Cinéma)',   widget: 'string' },
                { name: 'title',  label: 'Titre *',                       widget: 'string' },
                { name: 'text',   label: "Texte accueil (court)",         widget: 'text' },
                { name: 'detail', label: 'Texte détaillé',                widget: 'text' },
                { name: 'items',  label: 'Points forts',                  widget: 'list', field: { name: 'item', label: 'Point', widget: 'string' } }
              ]}
            ]
          }
        ]
      },
      {
        name: 'gallery',
        label: '📸 Galerie photo',
        editor: { preview: false },
        files: [
          {
            name: 'gallery',
            label: 'Photos & albums',
            file: 'data/gallery.json',
            editor: { preview: false },
            fields: [
              { name: 'gallery', label: 'Photos', widget: 'list', fields: [
                { name: 'src',   label: 'Image', widget: 'image' },
                { name: 'title', label: 'Titre (légende)', widget: 'string', required: false },
                { name: 'album', label: 'Album (regroupement)', widget: 'string', required: false }
              ]}
            ]
          }
        ]
      }
    ]
  }
});
</script>
</body>
</html>
